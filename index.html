<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mentalist Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ok:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#2b1f5a;color:#fff;font:700 16px/1.25 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:40px;transition:background .3s}
body.t-brawl{background:linear-gradient(#2a3fd0,#6a2fc0 60%,#3a1c7a) fixed}
body.t-clash{background:linear-gradient(#1b4fd8,#c0262d) fixed}
body.t-pubg{background:linear-gradient(#3a3a46,#14141a) fixed}
body.t-tg{background:linear-gradient(#2b8fe0,#1b3f8f) fixed}
body.t-steam{background:#1b1d29}
body.t-home{background:linear-gradient(#8c78d8,#4b3f8f) fixed}
main{padding:12px 14px;max-width:560px;margin:auto}
.top{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.pill{background:#0006;border:2px solid #0004;border-radius:14px;padding:10px 14px;font-size:14px;cursor:pointer;color:#fff}
.title{flex:1;text-align:center;background:#1c1830;border:3px solid #f5b400;border-radius:14px;padding:12px;font-size:20px;letter-spacing:1px}
.banner{position:relative;border-radius:18px;overflow:hidden;margin-bottom:12px;min-height:96px;display:flex;align-items:flex-end;padding:14px;font-style:italic;font-size:22px;text-transform:uppercase;text-shadow:0 2px 0 #0008;cursor:pointer;background-size:cover;background-position:center;border:2px solid #0003}
.banner .em{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:54px;opacity:.95}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2 .banner{min-height:120px;font-size:17px;justify-content:center;text-align:center}
.row2 .banner .em{position:static;transform:none;display:block;font-size:48px}
.row2 .banner{flex-direction:column;align-items:center;justify-content:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tab{background:#0007;border:2px solid #0005;border-radius:16px;padding:10px 16px;font-size:15px;cursor:pointer;color:#fff}
.tab.on{background:#fff2;border-color:#fff8}
.sec{background:linear-gradient(#34d5ff,#1b9ad8);border:3px solid #0a2a4a;border-radius:22px;padding:14px 12px 6px;color:#fff}
.sec.green{background:linear-gradient(#3be83b,#13a82a)}
.sec.dark{background:#2a2438}
.sec h2{margin:0 auto 12px;width:fit-content;background:#111;border:3px solid #0006;border-radius:10px;padding:8px 22px;font-size:22px;text-transform:uppercase;letter-spacing:1px}
.rowitem{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#2fd0ff,#1a9be0);border:3px solid #0a2a4a;border-radius:18px;margin-bottom:12px;overflow:hidden;min-height:92px;cursor:pointer}
.rowitem .ic{font-size:44px;padding-left:14px;width:80px}
.rowitem .nm{flex:1;font-size:20px;text-transform:uppercase;text-shadow:0 2px 0 #0006}
.rowitem .nm small{display:block;font-size:17px;margin-top:6px}
.rowitem .go{align-self:stretch;display:flex;align-items:center;padding:0 22px;background:#0a7a9a99;clip-path:polygon(18% 0,100% 0,100% 100%,0 100%);font-size:16px;text-transform:uppercase}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:6px}
.card{border-radius:14px;overflow:hidden;background:linear-gradient(#5bf05b,#2bc040);border:3px solid #0a3a12;text-align:center;cursor:pointer}
.card.dk{background:#38304f;border-color:#1c1730}
.card .h{background:#1d7a2c;font-size:12px;padding:5px 2px;text-transform:uppercase}
.card.dk .h{display:none}
.card .e{font-size:40px;padding:14px 0 6px}
.card .p{padding-bottom:10px;font-size:14px}
.card .nm{font-size:12px;padding:0 4px 4px}
.card .go{background:#1d7a2c;padding:8px 0;font-size:13px;text-transform:uppercase}
.card.dk .go{background:#25103f}
.card:active,.rowitem:active,.banner:active{transform:scale(.97)}
/* Steam / формы */
.steps{display:flex;flex-direction:column;gap:12px}
.step{background:#262837;border-radius:20px;padding:18px 16px;position:relative}
.step .no{position:absolute;left:-2px;top:-8px;background:#3a3d52;border-radius:12px;padding:3px 8px;font-size:12px;color:#aaa}
.step h3{margin:0 0 10px;font-size:18px}
.step .hint{color:#8a8da8;font-size:13px;font-weight:500;margin-top:8px}
.steam-h{font-size:26px;margin:6px 0 2px}.steam-s{color:#8a8da8;font-weight:500;margin-bottom:14px}
input{width:100%;padding:14px;border-radius:14px;border:1px solid #4a4d66;background:#1b1d29;color:#fff;font-size:16px;outline:none;font-weight:500}
.pay{display:flex;align-items:center;gap:12px;background:#1b1d29;border:2px solid #7c5cff;border-radius:16px;padding:16px;font-size:16px}
.pay b{color:#a88bff}
.bigbtn{width:100%;margin-top:14px;padding:17px;border:0;border-radius:16px;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(90deg,#7c5cff,#5b8cff);cursor:pointer}
.bigbtn:disabled{opacity:.45}
.rules{margin-top:18px;font-weight:500;color:#cfd0e0}
.rules div{display:flex;gap:12px;margin-bottom:14px;font-size:14px}
.rules span{background:#7c5cff;border-radius:8px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:800}
/* окно выбора товара */
.sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:9}
.sheet.on{display:flex}
.box{background:#262837;width:100%;border-radius:22px 22px 0 0;padding:20px 16px 28px;max-width:560px;margin:auto}
.box h3{margin:0 0 4px}.sub{color:#8a8da8;font-size:14px;margin-bottom:14px;font-weight:500}
.cancel{background:none;border:0;color:#8a8da8;width:100%;padding:12px;font-size:15px}
.note{font-size:12px;color:#8a8da8;margin-top:10px;text-align:center;font-weight:500}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#ef4444;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;display:none;font-size:14px}
.toast.ok{background:var(--ok)}
</style></head><body class="t-home">
<main id="app"></main>
<div class="sheet" id="sheet"><div class="box">
<h3 id="sTitle"></h3><div class="sub" id="sSub"></div>
<input id="account" autocomplete="off">
<button class="bigbtn" id="payBtn" style="margin-top:4px">Оплатить через СБП</button>
<button class="cancel" id="cancelBtn">Отмена</button>
<div class="note">Проверьте данные аккаунта — при ошибке средства могут быть утеряны. Выдача до 10 минут после оплаты.</div>
</div></div>
<div class="toast" id="toast"></div>
<script>
var tg = window.Telegram && window.Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }

// ===== СВОИ КАРТИНКИ: вставь ссылки на свои изображения (или оставь '' — будут значки) =====
var IMAGES = {
  banners: { pubg:'', steam:'', brawl:'', clash:'', tg:'' },   // фон баннера игры на главной
  items:   {}                                                   // например: { bs_g30:'https://.../gem.png' }
};
// =========================================================================================

var DATA, cur = {}, curGame = null, curTab = 0;
function $(s){return document.querySelector(s);}
function toast(m, ok){var t=$('#toast');t.textContent=m;t.className='toast'+(ok?' ok':'');t.style.display='block';setTimeout(function(){t.style.display='none';},3500);}
function theme(t){document.body.className='t-'+t;}
function ico(i){var u=IMAGES.items[i.id]; return u?'<img src="'+u+'" style="width:52px;height:52px;object-fit:contain">':(i.icon||'🎁');}

function init(){
  fetch('/api/catalog').then(function(r){return r.json();}).then(function(d){
    DATA=d;
    var id=new URLSearchParams(location.search).get('paid');
    if(id){fetch('/api/order/'+id).then(function(r){return r.json();}).then(function(o){
      toast(o.status==='paid'?'✅ Оплата получена! Заказ в работе':'Ожидаем подтверждение оплаты…',o.status==='paid');
      history.replaceState({},'','/');});}
    home();
  });
}
function bn(k,label,wide){
  var g=DATA.catalog[k], bg=IMAGES.banners[k]?' style="background-image:url('+IMAGES.banners[k]+')"':'';
  return '<div class="banner" onclick="openGame(\''+k+'\')"'+bg+'>'+(wide?'<span class="em">'+g.emoji+'</span>':'<span class="em">'+g.emoji+'</span>')+label+'</div>';
}
function home(){
  curGame=null; theme('home'); if(tg) tg.BackButton.hide();
  var h='<div class="top"><div class="title">'+DATA.store+'</div></div>';
  h+='<div style="background:linear-gradient(90deg,#2b2f55,#1a1d3a)">'+'</div>';
  h+=bn('pubg','PUBG Mobile',1).replace('class="banner"','class="banner" style="background:linear-gradient(120deg,#3a3a46,#14141a)"');
  h+=bn('steam','Steam',1).replace('class="banner"','class="banner" style="background:linear-gradient(120deg,#1b2a49,#0c1220)"');
  h+='<div class="row2">'+bn('clash','Clash Royale').replace('class="banner"','class="banner" style="background:linear-gradient(135deg,#1b4fd8,#c0262d)"')
    +bn('brawl','Brawl Stars').replace('class="banner"','class="banner" style="background:linear-gradient(135deg,#2a7bff,#3b2fd0)"')+'</div>';
  h+=bn('tg','Telegram',1).replace('class="banner"','class="banner" style="margin-top:12px;background:linear-gradient(120deg,#2b8fe0,#1b3f8f)"');
  $('#app').innerHTML=h; scrollTo(0,0);
}
function topbar(g){
  return '<div class="top"><div class="pill" onclick="home()">← Все игры</div><div class="title">'+g.title+'</div></div>';
}
function openGame(k, tab){
  var g=DATA.catalog[k]; curGame=k; curTab=tab||0; theme(k);
  if(tg){tg.BackButton.show();tg.BackButton.onClick(home);}
  if(g.custom) return steamPage(g);
  var secs=Object.keys(g.sections), h=topbar(g);
  h+='<div class="tabs">'+secs.map(function(s,i){return '<div class="tab'+(i===curTab?' on':'')+'" onclick="openGame(\''+k+'\','+i+')">'+s+'</div>';}).join('')+'</div>';
  var name=secs[curTab], list=g.sections[name];
  var rows = /пропуск|premium|звёзд/i.test(name) || list.length<=4;
  if(rows){
    h+='<div class="sec"><h2>'+name+'</h2>'+list.map(function(i){
      return '<div class="rowitem" onclick="pick(\''+k+'\',\''+i.id+'\')"><div class="ic">'+ico(i)+'</div><div class="nm">'+i.name+'<small>'+i.price+' ₽</small></div><div class="go">Выбрать</div></div>';
    }).join('')+'</div>';
  } else {
    var dark = k==='pubg', cls = dark?'card dk':'card';
    h+='<div class="sec '+(dark?'dark':'green')+'"><h2>'+name+'</h2><div class="grid3">'+list.map(function(i){
      return '<div class="'+cls+'" onclick="pick(\''+k+'\',\''+i.id+'\')"><div class="h">'+i.name+'</div><div class="e">'+ico(i)+'</div>'+(dark?'<div class="nm">'+i.name+'</div>':'')+'<div class="p">'+i.price+' ₽</div><div class="go">Выбрать</div></div>';
    }).join('')+'</div></div>';
  }
  $('#app').innerHTML=h; scrollTo(0,0);
}
function steamPage(g){
  var h=topbar(g)+'<div class="steam-h">Пополнить баланс Steam</div><div class="steam-s">Быстрое пополнение по логину</div><div class="steps">'
  +'<div class="step"><span class="no">01</span><h3>Пополнение РФ/СНГ региона</h3><input id="stLogin" placeholder="Введите логин Steam" autocomplete="off"><div class="hint">Страны: Russia, Belarus, Ukraine, Armenia, Azerbaijan, Georgia, Kazakhstan, Kyrgyzstan, Moldova, Tajikistan, Turkmenistan, Uzbekistan</div></div>'
  +'<div class="step"><span class="no">02</span><h3>Сколько должно прийти</h3><input id="stAmount" type="number" inputmode="numeric" placeholder="Сумма в рублях (от '+g.custom.min+')"><div class="hint">Вы платите ровно эту сумму</div></div>'
  +'<div class="step"><span class="no">03</span><h3>Метод оплаты</h3><div class="pay">⚡ Оплатить СБП за <b id="stSum">0 ₽</b></div></div></div>'
  +'<button class="bigbtn" id="stPay">Оплатить</button>'
  +'<div class="rules"><h3 style="margin:18px 0 12px">ⓘ Важные правила:</h3>'
  +'<div><span>1</span>Нужно ввести логин аккаунта. Если введёте неправильно — средства могут быть утеряны.</div>'
  +'<div><span>2</span>Никнейм не всегда совпадает с логином, нужно ввести именно логин.</div>'
  +'<div><span>3</span>После успешной оплаты средства поступят до 10 минут. Если не пришли — обратитесь в поддержку.</div></div>';
  $('#app').innerHTML=h; scrollTo(0,0);
  $('#stAmount').oninput=function(){$('#stSum').textContent=(Math.round(this.value)||0)+' ₽';};
  $('#stPay').onclick=function(){
    var l=$('#stLogin').value.trim();
    if(l.length<2) return toast('Введите логин Steam');
    cur={game:'steam',itemId:null,amount:$('#stAmount').value}; submit(l,$('#stPay'),'Оплатить');
  };
}
function pick(k,id){
  var g=DATA.catalog[k], item=null;
  Object.keys(g.sections).forEach(function(s){g.sections[s].forEach(function(i){if(i.id===id)item=i;});});
  cur={game:k,itemId:id};
  $('#sTitle').textContent=item.name; $('#sSub').textContent=g.title+' · '+item.price+' ₽ — '+g.field.label;
  $('#account').placeholder=g.field.ph; $('#account').value='';
  $('#sheet').classList.add('on');
}
function closeSheet(){$('#sheet').classList.remove('on');}
$('#cancelBtn').onclick=closeSheet;
$('#payBtn').onclick=function(){
  var a=$('#account').value.trim();
  if(a.length<2) return toast('Введите данные аккаунта');
  submit(a,$('#payBtn'),'Оплатить через СБП');
};
function submit(account,b,label){
  b.disabled=true; b.textContent='Создаём платёж…';
  fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    initData:(tg&&tg.initData)||'',game:cur.game,itemId:cur.itemId,account:account,amount:cur.amount})})
  .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error);return d;});})
  .then(function(d){closeSheet(); if(tg&&tg.openLink) tg.openLink(d.payUrl); else location.href=d.payUrl;})
  .catch(function(e){toast(e.message||'Ошибка');})
  .then(function(){b.disabled=false;b.textContent=label;});
}
init();
</script>
</body>
</html>
